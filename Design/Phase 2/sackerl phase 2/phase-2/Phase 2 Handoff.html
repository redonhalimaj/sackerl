<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sackerl · Phase 2 handoff</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: #ecede4;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif;
      color: var(--ink);
    }
    #app { min-height: 100vh; }

    /* shimmer for skeleton rows */
    @keyframes p2-shimmer {
      0%   { opacity: 0.55; }
      50%  { opacity: 1; }
      100% { opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) {
      [style*="p2-shimmer"] { animation: none !important; }
    }

    /* nicer scrolling for the state strips */
    .sk-app ::-webkit-scrollbar { height: 6px; width: 6px; }
    .sk-app ::-webkit-scrollbar-thumb {
      background: rgba(27,36,24,0.12); border-radius: 3px;
    }
    .sk-app ::-webkit-scrollbar-track { background: transparent; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>

  <!-- Phase 1 atoms -->
  <script type="text/babel" src="../ios-frame.jsx"></script>
  <script type="text/babel" src="../sk-atoms.jsx"></script>

  <!-- Phase 2 -->
  <script type="text/babel" src="phase-2-screens.jsx"></script>
  <script type="text/babel" src="phase-2-doc.jsx"></script>
  <script type="text/babel" src="phase-2-app.jsx"></script>
</body>
</html>
