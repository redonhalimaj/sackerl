<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sackerl · print</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body {
      margin: 0; padding: 0; background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif;
      color: #1B2418;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    #app { padding: 24px 0; }

    /* one frame per page */
    .pp {
      width: 100%;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      box-sizing: border-box;
      padding: 16px;
      page-break-after: always;
      break-after: page;
      position: relative;
    }
    .pp:last-child { page-break-after: auto; break-after: auto; }

    .pp-inner {
      position: relative;
      transform-origin: center center;
    }

    /* Landscape page for the desktop view */
    @page {
      size: A4 portrait;
      margin: 8mm;
    }
    @page landscape {
      size: A4 landscape;
      margin: 8mm;
    }
    .pp-landscape { page: landscape; }

    /* Screen-mode preview — show pages stacked nicely on a neutral mat */
    @media screen {
      body { background: #eceee4; padding: 20px 0; }
      .pp {
        background: #ffffff;
        max-width: 820px;
        margin: 0 auto 18px;
        border: 1px solid #E8ECDF;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);
        min-height: auto;
        padding: 28px;
      }
      .pp-landscape { max-width: 1180px; }
    }

    @media print {
      body { background: #fff; }
      #app { padding: 0; }
      .pp {
        background: #fff;
        page-break-after: always;
        break-after: page;
        padding: 0;
        min-height: 100vh;
      }
    }
  </style>

  <script>window.__SKIP_MOUNT = true;</script>

</head>
