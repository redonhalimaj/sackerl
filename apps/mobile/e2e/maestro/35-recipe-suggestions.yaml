appId: host.exp.Exponent
name: 35-recipe-suggestions
# Suggestions list -> open a recipe. Runs while stock is non-empty (N2).
env:
  METRO_URL: exp://127.0.0.1:8081
---
# Start from the tab root so an earlier flow cannot cascade.
- stopApp
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible:
      id: 'tabs\.home'
    timeout: 60000
- openLink: ${METRO_URL}/--/suggestions
# Flow 30 guarantees a stock item named exactly "E2E Milk", which matches catalogue recipes (N2).
- extendedWaitUntil:
    visible:
      id: 'suggestions\.list'
    timeout: 20000
- takeScreenshot: 35-suggestions
- tapOn:
    id: 'suggestions\.card\..*\.show'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'recipe\.title'
    timeout: 20000
- takeScreenshot: 35-recipe
