appId: host.exp.Exponent
name: 55-receipt-placement-tap
# SCKRL-305 tap-only placement (no drag): saved review -> Continue to placement -> tap each item, then
# its storage place -> Add to stock -> Home with the toast and no "Still confirming" leave alert.
# Runs in the default suite (no placement fault env).
env:
  METRO_URL: exp://127.0.0.1:8081
---
- stopApp
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible:
      id: 'tabs\.home'
    timeout: 60000
# Pending saved reviews before this flow's receipt exists; placement must leave the count unchanged.
- runFlow: lib/count-pending.yaml
- evalScript: ${output.pendingBefore = output.pending}
- runFlow: lib/review-and-save.yaml
- assertVisible:
    id: 'receipt-review\.continue-placement'
    enabled: true
- tapOn:
    id: 'receipt-review\.continue-placement'
- extendedWaitUntil:
    visible:
      id: 'receipt-placement\.dock'
    timeout: 30000
- assertVisible:
    id: 'receipt-placement\.submit'
    enabled: false
- takeScreenshot: 55-placement-start
# First item explicitly: select, selection bar shows, place in the fridge, chip becomes placed.
- tapOn:
    id: 'receipt-placement\.chip\.0'
- assertVisible:
    id: 'receipt-placement\.selection'
- runFlow:
    file: lib/scroll-to.yaml
    env:
      TARGET: 'receipt-placement\.zone\.fridge'
      DIRECTION: DOWN
- tapOn:
    id: 'receipt-placement\.zone\.fridge'
- runFlow:
    file: lib/scroll-to.yaml
    env:
      TARGET: 'receipt-placement\.placed\.0'
      DIRECTION: UP
- runFlow:
    file: lib/place-all-tap.yaml
    env:
      ZONE: pantry
- takeScreenshot: 55-placement-all-placed
# The success toast lasts 4 s: don't let the tap wait for the screen to settle, and wait for the
# toast before anything else (hard assertion).
- tapOn:
    id: 'receipt-placement\.submit'
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: 'receipt-placement\.toast'
    timeout: 30000
- assertVisible:
    id: 'home\.screen'
- assertVisible:
    id: 'tabs\.home'
- assertNotVisible: 'Still confirming'
- assertNotVisible:
    id: 'receipt-placement\.dock'
- takeScreenshot: 55-placement-home-toast
# The placed receipt is no longer a pending review: same count as before this flow saved its review
# (newest-first list, so a stale entry would add a row).
- runFlow: lib/count-pending.yaml
- assertTrue:
    condition: ${output.pending == output.pendingBefore}
    label: 'Pending reviews unchanged after placement (placed receipt not pending)'
- takeScreenshot: 55-home-pending-after
