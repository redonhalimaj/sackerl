appId: host.exp.Exponent
name: 20-storage-zones
# Home shows the chosen storage zones.
env:
  METRO_URL: exp://127.0.0.1:8081
---
# Start from the tab root so an earlier flow's pushed screen or failure doesn't cascade.
- stopApp
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible:
      id: 'tabs\.home'
    timeout: 60000
- tapOn:
    id: 'tabs\.home'
- assertVisible:
    id: 'home\.storage\.fridge'
- assertVisible:
    id: 'home\.storage\.pantry'
- takeScreenshot: 20-home-zones
