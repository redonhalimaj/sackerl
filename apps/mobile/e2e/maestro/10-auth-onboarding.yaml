appId: host.exp.Exponent
name: 10-auth-onboarding
# Signed-out onboarding -> keep default zones -> sign in with the synthetic user -> zones -> household -> Home.
# E2E_EMAIL / E2E_PASSWORD arrive as MAESTRO_E2E_* process env (never argv). METRO_URL defaults below.
env:
  METRO_URL: exp://127.0.0.1:8081
---
- stopApp
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible:
      id: '(onboarding\.get-started|tabs\.home|tabs\.settings)'
    timeout: 90000
- runFlow:
    when:
      visible:
        id: 'tabs\.settings'
    commands:
      - tapOn:
          id: 'tabs\.settings'
      - tapOn:
          id: 'settings\.sign-out'
      - runFlow:
          when:
            visible: 'Sign out'
          commands:
            - tapOn: 'Sign out'
- extendedWaitUntil:
    visible:
      id: 'onboarding\.get-started'
    timeout: 60000
- tapOn:
    id: 'onboarding\.get-started'
- assertVisible:
    id: 'storage-zones\.row\.fridge'
- tapOn:
    id: 'storage-zones\.continue'
- assertVisible:
    id: 'auth\.email'
- tapOn:
    id: 'auth\.email'
- inputText: ${MAESTRO_E2E_EMAIL}
- tapOn:
    id: 'auth\.password'
- inputText: ${MAESTRO_E2E_PASSWORD}
- takeScreenshot: 10-password-entered
- tapOn:
    id: 'auth\.submit'
# iOS offers to save the password and its sheet hides the app's element tree; dismiss it (never save).
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: 'Not Now'
    commands:
      - tapOn: 'Not Now'
- extendedWaitUntil:
    visible:
      id: '(storage-zones\.continue|tabs\.stock)'
    timeout: 30000
# Signed in with the zones chosen before sign-in: the app either returns to zones or goes straight Home.
- runFlow:
    when:
      visible:
        id: 'storage-zones\.continue'
    commands:
      - assertVisible:
          id: 'storage-zones\.continue'
          enabled: true
      - tapOn:
          id: 'storage-zones\.continue'
- extendedWaitUntil:
    visible:
      id: 'tabs\.stock'
    timeout: 30000
- assertVisible:
    id: 'home\.storage\.fridge'
