appId: host.exp.Exponent
name: 51-resume-after-restart
# Save a review with a unique line-0 name -> Done for now -> restart Expo Go -> resume that review from Home's pending list
# (newest first, so row 0) -> lines load and "Continue to placement" is enabled.
env:
  METRO_URL: exp://127.0.0.1:8081
---
- stopApp
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible:
      id: 'tabs\.home'
    timeout: 60000
- runFlow: lib/review-and-save.yaml
# Unique edit on line 0 so the resumed review is provably the same receipt (digits avoid QuickType).
- evalScript: ${output.tag = 'Milk ' + MAESTRO_E2E_RUN_ID.slice(8, 14)}
- runFlow:
    file: lib/scroll-to.yaml
    env:
      TARGET: 'receipt-review\.line\.0\.edit'
      DIRECTION: UP
- tapOn:
    id: 'receipt-review\.line\.0\.edit'
- tapOn:
    id: 'receipt-review\.edit\.name'
- eraseText: 30
- inputText: ${output.tag + ' '}
- pressKey: Enter
- repeat:
    times: 2
    while:
      notVisible:
        id: 'receipt-review\.edit\.name'
        text: '${output.tag}\s?'
    commands:
      - tapOn:
          id: 'receipt-review\.edit\.name'
      - eraseText: 30
      - inputText: ${output.tag + ' '}
      - pressKey: Enter
- assertVisible:
    id: 'receipt-review\.edit\.name'
    text: '${output.tag}\s?'
- scrollUntilVisible:
    element:
      id: 'receipt-review\.edit\.mark-reviewed'
- tapOn:
    id: 'receipt-review\.edit\.mark-reviewed'
- assertVisible: '${output.tag}\s?'
- runFlow:
    file: lib/scroll-to.yaml
    env:
      TARGET: 'receipt-review\.save'
      DIRECTION: DOWN
- tapOn:
    id: 'receipt-review\.save'
- extendedWaitUntil:
    visible:
      text: 'Review saved\. Items are not in stock yet\.'
    timeout: 20000
- runFlow:
    file: lib/scroll-to.yaml
    env:
      TARGET: 'receipt-review\.status'
      DIRECTION: UP
- assertVisible:
    id: 'receipt-review\.status'
    text: 'Review saved\. Items are not in stock yet\.'
- runFlow:
    file: lib/scroll-to.yaml
    env:
      TARGET: 'receipt-review\.done-for-now'
      DIRECTION: DOWN
- tapOn:
    id: 'receipt-review\.done-for-now'
- extendedWaitUntil:
    visible:
      id: 'home\.screen'
    timeout: 20000
# Restart and resume.
- stopApp
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible:
      id: 'tabs\.home'
    timeout: 60000
- runFlow:
    file: lib/scroll-to.yaml
    env:
      TARGET: 'home\.pending-reviews\.row\.0'
      DIRECTION: DOWN
- takeScreenshot: 51-home-pending
- tapOn:
    id: 'home\.pending-reviews\.row\.0'
- extendedWaitUntil:
    visible:
      id: 'receipt-review\.lines'
    timeout: 30000
- runFlow:
    file: lib/scroll-to.yaml
    env:
      TARGET: 'receipt-review\.continue-placement'
      DIRECTION: DOWN
- assertVisible:
    id: 'receipt-review\.continue-placement'
    enabled: true
- takeScreenshot: 51-resumed-review
# Same receipt: line 0 carries this run's unique edited name.
- runFlow:
    file: lib/scroll-to.yaml
    env:
      TARGET: 'receipt-review\.line\.0\.name'
      DIRECTION: UP
- assertVisible: '${output.tag}\s?'
- takeScreenshot: 51-resumed-same-receipt
