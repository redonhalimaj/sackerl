appId: host.exp.Exponent
name: 90-sign-out
# Settings -> sign out.
env:
  METRO_URL: exp://127.0.0.1:8081
---
# Start from the tab root so an earlier flow's pushed screen or failure doesn't cascade.
- stopApp
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible:
      id: 'tabs\.home'
    timeout: 60000
- tapOn:
    id: 'tabs\.settings'
- scrollUntilVisible:
    element:
      id: 'settings\.sign-out'
- tapOn:
    id: 'settings\.sign-out'
- runFlow:
    when:
      visible: 'Sign out'
    commands:
      - tapOn: 'Sign out'
- extendedWaitUntil:
    notVisible:
      id: 'tabs\.home'
    timeout: 15000
- takeScreenshot: 90-signed-out
