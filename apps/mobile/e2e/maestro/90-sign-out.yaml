appId: host.exp.Exponent
name: 90-sign-out
# Settings -> sign out.
env:
  METRO_URL: exp://127.0.0.1:8081
---
# Start from the tab root so an earlier flow's pushed screen or failure doesn't cascade.
- stopApp
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible:
      id: 'tabs\.home'
    timeout: 60000
- tapOn:
    id: 'tabs\.settings'
- scrollUntilVisible:
    element:
      id: 'settings\.sign-out'
- tapOn:
    id: 'settings\.sign-out'
- runFlow:
    when:
      visible: 'Sign out'
    commands:
      # Optional: the confirm can resolve between the visibility check and this tap (signed-out
      # screen already showing); the waits below still prove sign-out.
      - tapOn:
          text: 'Sign out'
          optional: true
- extendedWaitUntil:
    notVisible:
      id: 'tabs\.home'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: '(onboarding\.get-started|auth\.email)'
    timeout: 15000
- takeScreenshot: 90-signed-out
