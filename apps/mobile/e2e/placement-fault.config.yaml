# Fault-mode workspace config (`node apps/mobile/e2e/run.mjs --placement-fault`): Metro runs with
# EXPO_PUBLIC_APP_ENV=dev and EXPO_PUBLIC_E2E_PLACEMENT_FAULT=drop-first-response. Fresh user per run;
# 15-fresh-user-scan goes straight to Scan with no household row (SCKRL-924: Scan ensures it).
flows:
  - '10-auth-onboarding.yaml'
  - '15-fresh-user-scan.yaml'
  - '56-receipt-placement-unknown-retry.yaml'
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - 10-auth-onboarding
    - 15-fresh-user-scan
    - 56-receipt-placement-unknown-retry
